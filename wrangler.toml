name = "phxsugaring-com-v1"
compatibility_date = "2026-09-29"
workers_dev = false
preview_urls = false
main = "./src/worker.ts"

[[routes]]
pattern = "phxsugaring.com"
custom_domain = true

[[routes]]
pattern = "www.phxsugaring.com"
custom_domain = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"

[observability]
enabled = true
head_sampling_rate = 1
